[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-ego-0-robocasa24-eval"
version = "0.1.0"
description = "Inference-only evaluation for ACE-Ego-0 on GR1 RoboCasa 24."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.0",
  "accelerate==1.12.0",
  "diffusers==0.36.0",
  "omegaconf==2.3.0",
  "pyyaml>=6.0",
  "numpy==1.26.4",
  "pillow>=10",
  "scipy",
  "opencv-python==4.11.0.86",
  "matplotlib",
  "msgpack",
  "websockets",
  "gymnasium",
  "tyro==1.0.16",
  "av",
  "mujoco==3.2.6",
  "mink==0.0.5",
  "qpsolvers[quadprog]>=4.12.0",
  "yourdfpy",
  "pydantic==2.10.6",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ace_ego_0*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E501", "F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
